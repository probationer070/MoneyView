# Google News RSS queries for the risk engine (spec 2026-10-19 section 5.1).
# Topic order is the order macro news is listed on an alert. Theme ids must match
# watchlist_themes.yaml; series must be in constants.RISK_FRED_SERIES.
topics:
  - id: cpi
    ko: CPI
    en: CPI
    queries:
      en: ["US CPI inflation", "consumer price index report"]
      ko: ["미국 소비자물가 CPI", "미국 물가 상승률"]
    series: [CPIAUCSL, CPILFESL]
  - id: pce
    ko: PCE
    en: PCE
    queries:
      en: ["US PCE inflation", "core PCE price index"]
      ko: ["미국 PCE 물가지수", "근원 PCE"]
    series: [PCEPI, PCEPILFE]
  - id: fomc
    ko: 연준·금리 결정·발언
    en: Fed, rate decisions and remarks
    queries:
      en: ["Federal Reserve FOMC rate decision", "Fed chair Powell remarks"]
      ko: ["연준 FOMC 금리", "연준 의장 발언"]
    series: [DFEDTARU]
  - id: jobs
    ko: 고용
    en: Jobs
    queries:
      en: ["US jobs report nonfarm payrolls", "US unemployment rate"]
      ko: ["미국 고용지표 비농업 고용", "미국 실업률"]
    series: [PAYEMS]
  - id: treasury
    ko: 국채 금리
    en: Treasury yields
    queries:
      en: ["10-year Treasury yield", "bond market yields surge"]
      ko: ["미국 국채 금리", "미국 10년물 국채 수익률"]
    series: [DGS10]
  - id: credit
    ko: 하이일드·신용
    en: High yield and credit
    queries:
      en: ["high yield bond spreads", "credit market stress"]
      ko: ["하이일드 채권 스프레드", "신용 시장 경색"]
    series: [BAMLH0A0HYM2]
  - id: oil
    ko: 유가
    en: Oil prices
    queries:
      en: ["Brent crude oil price", "oil prices OPEC"]
      ko: ["국제 유가 브렌트유", "국제 유가 급등"]
    series: [DCOILBRENTEU]

series_labels:
  CPIAUCSL: {ko: CPI, en: CPI}
  CPILFESL: {ko: 근원 CPI, en: Core CPI}
  PCEPI: {ko: PCE, en: PCE}
  PCEPILFE: {ko: 근원 PCE, en: Core PCE}
  DFEDTARU: {ko: 연방기금금리 목표 상단, en: Fed funds target upper bound}
  PAYEMS: {ko: 비농업 고용, en: Nonfarm payrolls}
  DGS10: {ko: 미국 10년물 금리, en: 10-year Treasury yield}
  BAMLH0A0HYM2: {ko: 하이일드 스프레드, en: High-yield spread}
  DCOILBRENTEU: {ko: 브렌트유, en: Brent crude}

