[project]
name = "moneyview"
version = "0.2.1"
description = "MoneyView Financial Analytics Platform - Local-First Desktop"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "requests",
    "yfinance",
    "beautifulsoup4",
    "bottleneck>=1.3.6",
    "lxml",
    "lxml[html_clean]",
    "feedparser",
    "youtube-transcript-api",
    "yt-dlp",
    # "investiny",
    # FastAPI backend dependencies.
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-json-logger>=2.0.7",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.3.3",
    "prometheus-fastapi-instrumentator>=8.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore:Pandas requires version '1\\.3\\.6' or newer of 'bottleneck'.*:UserWarning",
]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["tests/*", "scripts/*"]
