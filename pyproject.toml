[project]
name = "money"
version = "0.1.0"
description = "MoneyView Economy Dashboard"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "numpy",
    "plotly",
    "requests",
    "yfinance",
    "beautifulsoup4",
    "streamlit",
    "lxml",
    "yt-dlp",
    "feedparser",
    "youtube-transcript-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["WebScrap", "views"]
