[project]
name = "moneyview"
version = "0.2.0"
description = "MoneyView Financial Analytics Platform - Local-First Desktop"
requires-python = ">=3.12"
dependencies = [
    # Legacy Streamlit app dependencies.
    "pandas",
    "numpy",
    "plotly",
    "requests",
    "yfinance",
    "beautifulsoup4",
    "streamlit",
    "lxml",
    "lxml[html_clean]",
    "feedparser",
    "youtube-transcript-api",
    # "investiny",
    # FastAPI backend dependencies.
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["apps", "packages"]
omit = ["tests/*", "scripts/*"]
