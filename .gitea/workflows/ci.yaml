name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan for secrets (new commits)
        run: |
          gitleaks detect \
            --source . \
            --log-opts "origin/main..HEAD" \
            --report-format json \
            --report-path gitleaks-report.json || {
            echo "::error::gitleaks found secrets — push blocked"
            exit 1
          }

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hadolint
        run: |
          wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfile
        run: hadolint Dockerfile

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and run tests
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen --extra dev
          uv run pytest tests/core_finance/ tests/api/ -q

  build-push:
    runs-on: ubuntu-latest
    needs: [lint, test, secrets-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set short SHA
        run: echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Build and export to Docker archive
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=/tmp/moneyview-api.tar
          provenance: false

      - name: Install trivy
        run: |
          curl -sfL --retry 3 --retry-delay 5 \
            "https://github.com/aquasecurity/trivy/releases/download/v0.71.2/trivy_0.71.2_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy

      - name: Scan — CRITICAL (block only if fix available)
        run: |
          trivy image \
            --input /tmp/moneyview-api.tar \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --format table

      - name: Install regctl
        run: |
          curl -sfL "https://github.com/regclient/regclient/releases/download/v0.7.2/regctl-linux-amd64" \
            -o /usr/local/bin/regctl && chmod +x /usr/local/bin/regctl

      - name: Push to Harbor via regctl
        if: github.event_name == 'push'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_URL }}
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          mkdir -p ~/.regctl
          jq -n \
            --arg h "$HARBOR_HOST" \
            --arg u "$HARBOR_USER" \
            --arg p "$HARBOR_PASS" \
            '{"hosts":{($h):{"tls":"enabled","user":$u,"pass":$p}}}' \
            > ~/.regctl/config.json
          # Harbor's vuln-gate returns 412 on manifest HEAD for unscanned images.
          # Delete :edge first so regctl import starts fresh without a manifest check.
          curl -sf -u "$HARBOR_USER:$HARBOR_PASS" -X DELETE \
            "https://$HARBOR_HOST/api/v2.0/projects/moneyview/repositories/api/artifacts/edge" \
            || true
          regctl image import \
            "$HARBOR_HOST/moneyview/api:edge" \
            /tmp/moneyview-api.tar

      - name: Add SHA tag via Harbor API
        if: github.event_name == 'push'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_URL }}
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          curl -sf \
            -u "$HARBOR_USER:$HARBOR_PASS" \
            -H "Content-Type: application/json" \
            -X POST \
            "https://$HARBOR_HOST/api/v2.0/projects/moneyview/repositories/api/artifacts/edge/tags" \
            -d "{\"name\":\"sha-${SHORT_SHA}\"}"
          echo "Tagged as sha-${SHORT_SHA}"

      - name: Install cosign
        if: github.event_name == 'push'
        run: |
          curl -O -L \
            https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
          chmod +x cosign-linux-amd64
          mv cosign-linux-amd64 /usr/local/bin/cosign

      - name: Sign image by digest
        if: github.event_name == 'push'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_URL }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE_DIGEST=$(regctl image digest "$HARBOR_HOST/moneyview/api:edge")
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"
          echo "$COSIGN_PRIVATE_KEY" > /tmp/cosign.key
          COSIGN_PASSWORD="$COSIGN_PASSWORD" cosign sign \
            --key /tmp/cosign.key \
            --tlog-upload=false \
            --yes \
            "$HARBOR_HOST/moneyview/api@${IMAGE_DIGEST}"
          rm -f /tmp/cosign.key
          echo "Signed: $HARBOR_HOST/moneyview/api@${IMAGE_DIGEST}"

      - name: Update moneyview-manifests image tag
        if: github.event_name == 'push'
        env:
          HARBOR_HOST: ${{ secrets.HARBOR_URL }}
          MANIFESTS_TOKEN: ${{ secrets.MANIFESTS_TOKEN }}
        run: |
          git config --global user.email "ci@gitea.local"
          git config --global user.name "Gitea CI"
          git clone "http://ci:${MANIFESTS_TOKEN}@gitea:3000/probationer070/moneyview-manifests.git" /tmp/manifests
          cd /tmp/manifests
          sed -i "s|image: .*/moneyview/api:.*|image: ${HARBOR_HOST}/moneyview/api:sha-${SHORT_SHA}|" apps/moneyview/deployment.yaml
          git add apps/moneyview/deployment.yaml
          git diff --cached --quiet || git commit -m "ci: update moneyview/api to sha-${SHORT_SHA}"
          git push
